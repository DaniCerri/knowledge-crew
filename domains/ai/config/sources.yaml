# Fonti del dominio AI. Primo dominio, anche ambito di test/benchmark della pipeline.
# Regola: 10-15 fonti curate = 80% del valore.
#
# type: rss | arxiv | hackernews | reddit | github_releases | email | searxng
# authority: [0, 1] statico, usato dal priority scoring

sources:
  - id: anthropic-news
    type: rss
    url: https://www.anthropic.com/news/rss
    domain: ai
    authority: 0.9

  - id: huggingface-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    domain: ai
    authority: 0.8

  - id: simon-willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    domain: ai
    authority: 0.8

  - id: arxiv-cs-cl
    type: arxiv
    query: "cat:cs.CL"
    max_per_run: 20
    domain: ai
    authority: 0.7

  - id: arxiv-cs-lg
    type: arxiv
    query: "cat:cs.LG"
    max_per_run: 20
    domain: ai
    authority: 0.7

  - id: arxiv-cs-ai
    type: arxiv
    query: "cat:cs.AI"
    max_per_run: 20
    domain: ai
    authority: 0.7

  - id: hn-front-page
    type: hackernews
    min_score: 100
    domain: ai
    authority: 0.5

  - id: tldr-ai
    type: email
    from_address: dan@tldrnewsletter.com
    domain: ai
    authority: 0.6

  # aggiungere altre fonti curate qui — fermarsi a 10-15
